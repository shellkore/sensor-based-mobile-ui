name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm ci --prefix demos
      - run: npm run build --prefix demos
      - run: npm pack --dry-run
      - run: npm ci --prefix acceptance
      - name: Install the current library into the acceptance app
        run: npm install --prefix acceptance --no-save --package-lock=false --install-links .
      - run: npx --prefix acceptance playwright install --with-deps chromium
      - run: npm run test:ui
